name: Verify Clang 21 Installation

on:
  workflow_dispatch:  # 添加手动触发选项
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "下载并安装 Clang 21"
        run: |
          echo "正在下载 Clang 21..."
          mkdir -p clang-21 && cd clang-21
          wget https://github.com/ZyCromerZ/Clang/releases/download/21.0.0git-20250618-release/Clang-21.0.0git-20250618.tar.gz
          echo "Clang 21.0.0 下载完成，正在解压..."
          if [ $? -ne 0 ]; then
              echo "下载失败，请检查网络连接或链接是否有效。" >&2
              exit 1
          fi
          tar -xzf Clang-21.0.0git-20250618.tar.gz
          if [ $? -ne 0 ]; then
              echo "解压失败，请检查下载的文件是否完整。" >&2
              exit 1
          fi
          rm Clang-21.0.0git-20250618.tar.gz
          echo "Clang 21.0.0 已下载并解压到 clang-21 目录中。"
          
          # 将 Clang 添加到 PATH
          echo "$GITHUB_WORKSPACE/clang-21/bin" >> $GITHUB_PATH
      
      - name: "验证 Clang 安装"
        run: |
          echo "验证 Clang 版本..."
          clang --version
          if [ $? -ne 0 ]; then
              echo "Clang 21 未正确安装或未找到。" >&2
              exit 1
          fi
          
          echo "验证 Clang++ 版本..."
          clang --version
          if [ $? -ne 0 ]; then
              echo "Clang++ 21 未正确安装或未找到。" >&2
              exit 1
          fi
          
          echo "创建测试程序..."
          cat << 'EOF' > test_clang.cpp
          #include <iostream>
          int main() {
              std::cout << "Clang 21 安装验证成功!\n";
              return 0;
          }
          EOF
          
          echo "编译测试程序..."
          clang -std=c++20 test_clang.cpp -o test_clang
          if [ $? -ne 0 ]; then
              echo "编译失败，Clang 21 可能未正确安装。" >&2
              exit 1
          fi
          
          echo "运行测试程序..."
          ./test_clang
          if [ $? -ne 0 ]; then
              echo "运行失败，编译后的程序有问题。" >&2
              exit 1
          fi
          
          echo "Clang 21 验证成功!"
